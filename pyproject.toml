[project]
name = "hammertools"
dynamic = ["version"]
description = "Geradores e lint de VMF para Hammer++ (marcadores ht_* -> geometria)"
requires-python = ">=3.10"
dependencies = ["srctools>=2.7"]

[project.optional-dependencies]
lint = ["numpy", "scipy"]  # teste de leak e nodraw do `ht lint`

[project.scripts]
ht = "hammertools.cli:main"
ht-vbsp = "hammertools.cli:vbsp_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hammertools*"]

[tool.setuptools.dynamic]
version = {attr = "hammertools.__version__"}

[tool.setuptools.package-data]
hammertools = ["*.fgd"]
